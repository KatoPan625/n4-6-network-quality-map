services:
  db:
    image: postgis/postgis:17-3.5
    container_name: n46-postgis
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema chinh thuc V2.1 cua nhom; chi chay khi volume trong
      - ../db/N4.6_Database_Schema_V2.1.sql:/docker-entrypoint-initdb.d/01_schema_v2.1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
